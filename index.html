<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recanto Petshop | Catálogo Dom José</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-primary: #23B5C8;
      --brand-primary-dark: #1994a4;
      --brand-page-bg: #effafb;
      --brand-card-bg: #e1f5f8;
      --brand-card-border: #a7e3ec;
      --brand-accent: #EE3E80;
    }
    body { font-family: 'Inter', sans-serif; background-color: var(--brand-page-bg); color: #1E293B; transition: background-color 0.3s ease; }
    .font-brand { font-family: 'Fredoka', sans-serif; }
    .brand-gradient-bar { background: linear-gradient(90deg, var(--brand-accent) 0%, var(--brand-accent) 35%, #6AB43E 35%, #6AB43E 65%, var(--brand-primary) 65%, var(--brand-primary) 100%); height: 6px; }
    .brand-banner-bg { background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-primary-dark) 100%); }
    .brand-primary-bg { background-color: var(--brand-primary); border-color: var(--brand-primary); color: #ffffff; }
    .brand-accent-bg { background-color: var(--brand-accent); border-color: var(--brand-accent); color: #ffffff; }
    .brand-primary-text { color: var(--brand-primary); }
    .brand-accent-text { color: var(--brand-accent); }
    .theme-stage-box { background-color: var(--brand-card-bg); border-color: var(--brand-card-border); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-24">

  <div class="brand-gradient-bar w-full sticky top-0 z-50"></div>

  <!-- Cabeçalho Público do Cliente -->
  <header class="bg-white shadow-sm sticky top-1.5 z-40 h-16 flex items-center border-b" style="border-color: var(--brand-card-border);">
    <div class="max-w-4xl w-full mx-auto px-4 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 h-12">
        <div id="default-logo-elements" class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-full border-2 flex items-center justify-center shadow-sm shrink-0" style="border-color: var(--brand-primary); background-color: var(--brand-card-bg);">
            <span class="font-brand text-xl font-bold leading-none brand-primary-text">R</span>
          </div>
          <div>
            <div class="font-brand text-xl tracking-tight leading-none flex items-center">
              <span class="text-[#EE3E80]">R</span><span class="text-[#6AB43E]">e</span><span class="text-[#23B5C8]">c</span><span class="text-[#FDD815] drop-shadow-[0_1px_1px_rgba(0,0,0,0.2)]">a</span><span class="text-[#EE3E80]">n</span><span class="text-[#6AB43E]">t</span><span class="text-[#23B5C8]">o</span>
            </div>
            <span class="block text-[9px] font-bold tracking-[0.22em] text-slate-600 uppercase mt-0.5">PETSHOP • DOM JOSÉ</span>
          </div>
        </div>

        <div id="custom-logos-wrapper" class="hidden flex items-center gap-2.5">
          <div id="header-symbol-frame" class="hidden w-10 h-10 rounded-full overflow-hidden border border-slate-200 shadow-sm shrink-0 flex items-center justify-center bg-white">
            <img id="custom-symbol-img" class="w-full h-full object-cover" alt="Logo" />
          </div>
          <div id="header-name-frame" class="hidden h-9 flex items-center">
            <img id="custom-name-img" class="h-full max-w-[165px] object-contain" alt="Nome" />
          </div>
        </div>
      </div>

      <button onclick="openCartModal()" class="px-3.5 py-2 rounded-xl brand-accent-bg text-xs font-bold shadow flex items-center gap-1.5 active:scale-95">
        <span>🛒 Sacola</span>
        <span id="header-cart-count" class="bg-white text-slate-900 px-1.5 py-0.5 rounded-full text-[11px] font-extrabold leading-none">0</span>
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-4 space-y-4">

    <!-- ==================== VITRINE DO CLIENTE ==================== -->
    <section id="view-storefront" class="space-y-4">
      
      <!-- Banner de Boas-Vindas -->
      <div class="brand-banner-bg rounded-2xl p-4 sm:p-5 text-white shadow-md space-y-1">
        <span class="inline-block text-[10px] font-bold uppercase tracking-wider bg-white/20 px-2.5 py-0.5 rounded-full">🛵 Entrega Rápida no Bairro</span>
        <h1 class="font-brand text-xl sm:text-2xl font-bold leading-tight" id="banner-title">Catálogo Online — Jardim Dom José</h1>
        <p class="text-xs text-white/90" id="banner-subtitle">Escolha suas rações, petiscos e antipulgas e envie seu pedido direto no WhatsApp!</p>
      </div>

      <!-- Barra de Busca -->
      <div class="bg-white rounded-2xl p-3 shadow-sm border-2 flex items-center gap-2" style="border-color: var(--brand-card-border);">
        <span class="text-base pl-1">🔍</span>
        <input type="text" id="catalog-search" oninput="renderCatalog()" placeholder="Buscar ração, Simparic, Credeli, sachê, petisco..." 
          class="w-full text-sm bg-transparent focus:outline-none text-slate-800" />
        <button onclick="clearSearch()" id="btn-clear-search" class="hidden text-xs font-bold text-slate-400 px-2">✕</button>
      </div>

      <!-- Filtro por Categorias -->
      <div id="categories-bar" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1"></div>

      <!-- Grade de Produtos -->
      <div id="products-loading" class="text-center py-10 text-xs font-bold text-slate-500">
        🔄 Carregando produtos da loja...
      </div>
      <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
    </section>

    <!-- ==================== PAINEL EXCLUSIVO DO CATÁLOGO (LOJISTA) ==================== -->
    <section id="view-catalog-admin" class="hidden space-y-4">
      <div class="bg-slate-900 text-white rounded-2xl p-4 flex items-center justify-between">
        <div>
          <span class="text-[10px] brand-accent-bg px-2 py-0.5 rounded-full font-bold uppercase">Gestão da Vitrine</span>
          <h2 class="font-brand text-lg font-bold mt-0.5">Configurar Catálogo Online</h2>
        </div>
        <button onclick="exitCatalogAdmin()" class="px-3 py-1.5 rounded-xl bg-slate-800 text-white text-xs font-bold">⬅️ Voltar à Loja</button>
      </div>

      <!-- Cores e Logos do Catálogo -->
      <div class="bg-white rounded-2xl p-4 border-2 shadow-sm space-y-4" style="border-color: var(--brand-card-border);">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h3 class="font-bold text-slate-800 text-sm">🎨 Cores e Identidade do Catálogo</h3>
          <button type="button" onclick="extractColorsFromLogo()" class="px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold">✨ Puxar Cor da Logo</button>
        </div>
        <div id="theme-presets

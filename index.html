<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recanto Petshop | Catálogo Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-primary: #23B5C8;
      --brand-primary-dark: #1994a4;
      --brand-page-bg: #effafb;
      --brand-card-bg: #e1f5f8;
      --brand-card-border: #a7e3ec;
      --brand-accent: #EE3E80;
    }
    body { font-family: 'Inter', sans-serif; background-color: var(--brand-page-bg); color: #1E293B; }
    .font-brand { font-family: 'Fredoka', sans-serif; }
    .brand-gradient-bar { background: linear-gradient(90deg, var(--brand-accent) 0%, var(--brand-accent) 35%, #6AB43E 35%, #6AB43E 65%, var(--brand-primary) 65%, var(--brand-primary) 100%); height: 6px; }
    .brand-banner-bg { background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-primary-dark) 100%); }
    .brand-primary-bg { background-color: var(--brand-primary); border-color: var(--brand-primary); color: #ffffff; }
    .brand-accent-bg { background-color: var(--brand-accent); border-color: var(--brand-accent); color: #ffffff; }
    .brand-primary-text { color: var(--brand-primary); }
    .brand-accent-text { color: var(--brand-accent); }
    .theme-stage-box { background-color: var(--brand-card-bg); border-color: var(--brand-card-border); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-24">

  <div class="brand-gradient-bar w-full sticky top-0 z-50"></div>

  <!-- Cabeçalho -->
  <header class="bg-white shadow-sm sticky top-1.5 z-40 h-16 flex items-center border-b" style="border-color: var(--brand-card-border);">
    <div class="max-w-4xl w-full mx-auto px-4 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 h-12" onclick="goHome()" style="cursor:pointer;" title="Voltar ao Início">
        <div class="w-10 h-10 rounded-full border-2 flex items-center justify-center shadow-sm shrink-0" style="border-color: var(--brand-primary); background-color: var(--brand-card-bg);">
          <span class="font-brand text-xl font-bold leading-none brand-primary-text" id="header-logo-letter">R</span>
        </div>
        <div>
          <div class="font-brand text-xl tracking-tight leading-none flex items-center" id="header-brand-name">
            <span class="text-[#EE3E80]">R</span><span class="text-[#6AB43E]">e</span><span class="text-[#23B5C8]">c</span><span class="text-[#FDD815]">a</span><span class="text-[#EE3E80]">n</span><span class="text-[#6AB43E]">t</span><span class="text-[#23B5C8]">o</span>
          </div>
          <span class="block text-[9px] font-bold tracking-[0.22em] text-slate-600 uppercase mt-0.5" id="header-subtitle">PETSHOP • DOM JOSÉ</span>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button onclick="openCartModal()" class="px-3 py-2 rounded-xl brand-accent-bg text-xs font-bold shadow flex items-center gap-1.5 active:scale-95">
          <span>🛒 Sacola</span>
          <span id="header-cart-count" class="bg-white text-slate-900 px-1.5 py-0.5 rounded-full text-[11px] font-extrabold leading-none">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-4 space-y-4">

    <section id="view-storefront" class="space-y-4">
      
      <!-- Busca Global / Contextual -->
      <div class="bg-white rounded-2xl p-3 shadow-sm border-2 flex items-center gap-2 sticky top-20 z-30" style="border-color: var(--brand-card-border);">
        <span class="text-base pl-1">🔍</span>
        <input type="search" id="catalog-search" autocomplete="off" oninput="renderStorefront()" placeholder="Buscar ração, Simparic, areia, petisco..." 
          class="w-full text-sm bg-transparent focus:outline-none text-slate-800" />
        <button onclick="clearSearch()" id="btn-clear-search" class="hidden text-xs font-bold text-slate-400 px-2">✕</button>
      </div>

      <!-- Menu Principal (Espécies) -->
      <div id="home-especies" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <button onclick="selectEspecie('Cães')" class="bg-white border-2 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 shadow-sm active:scale-95 transition-transform" style="border-color: #a3e635;">
          <span class="text-4xl">🐶</span>
          <span class="font-bold text-slate-800 text-sm">Cães</span>
        </button>
        <button onclick="selectEspecie('Gatos')" class="bg-white border-2 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 shadow-sm active:scale-95 transition-transform" style="border-color: #fca5a5;">
          <span class="text-4xl">🐱</span>
          <span class="font-bold text-slate-800 text-sm">Gatos</span>
        </button>
        <button onclick="selectEspecie('Pássaros & Roedores')" class="bg-white border-2 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 shadow-sm active:scale-95 transition-transform" style="border-color: #fde047;">
          <span class="text-4xl">🐦</span>
          <span class="font-bold text-slate-800 text-sm text-center leading-tight">Pássaros &<br>Outros</span>
        </button>
        <button onclick="selectEspecie('Farmácia')" class="bg-white border-2 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 shadow-sm active:scale-95 transition-transform" style="border-color: #7dd3fc;">
          <span class="text-4xl">💊</span>
          <span class="font-bold text-slate-800
